stages:
  - build
  - test
  - deploy

variables:
  NODE_VERSION: "20"

build_job:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

test_job:
  stage: test
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm test
  dependencies:
    - build_job

deploy_job:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - echo "Deploying..."
    - ./deploy.sh
  only:
    - main
  environment:
    name: production
