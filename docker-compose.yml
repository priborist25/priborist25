services:
  maildev:
      image: maildev/maildev
      environment:
        - TZ=Europe/Moscow
        - MAILDEV_WEB_PORT=1080
        - MAILDEV_SMTP_PORT=1025
      ports:
        - "8080:1080"
        - "1025:1025"
      logging:
        driver: "json-file"
        options:
          max-size: "1m"

  # postgres:
  #   container_name: postgres
  #   image: postgres:17-alpine
  #   environment:
  #     - POSTGRES_USER=max
  #     - POSTGRES_PASSWORD=12345678
  #     - POSTGRES_DB=pizda
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - db_network

  postgres_test:
    container_name: test_postgres
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=max
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=pizda
    ports:
      - "5433:5432"
    networks:
      - test_db_network

  # adminer:
  #   image: adminer
  #   container_name: adminer
  #   ports:
  #     - "8000:8080"
  #   networks:
  #     - db_network
  #   depends_on:
  #     - postgres

  test_adminer:
    image: adminer
    container_name: test_adminer
    ports:
      - "8800:8080"
    networks:
      - test_db_network
    depends_on:
      - postgres_test

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAUTL_USER=guest
      - RABBITMQ_DEFAUTL_PASSWORD=guest

  # fastapi:
  #     container_name: fastapi
  #     image: fastapi
  #     ports: 
  #       - "5000:5000"
  #     networks:
  #       - db_network
  #     develop:
  #       watch:
  #         - action: sync+restart
  #           path: .
  #           target: .
  #     volumes:
  #       - .:/app
            
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
   
networks:
  db_network:
  test_db_network:
